# ラズパイ / Azure VM などで Bot を常時動かすための設定。使い方は docs/deploy.md
services:
  bot:
    build: .
    image: atcoder-bot
    container_name: atcoder-bot
    restart: unless-stopped          # 落ちても、マシンを再起動しても自動で立ち上がる
    env_file: app/.env               # DISCORD_TOKEN などはイメージに入れず、ここから渡す
    environment:
      DB_PATH: /data/database.db     # DB は下の ./data に保存されるので、作り直しても消えない
    volumes:
      - ./data:/data                 # ./data/database.db と ./data/backups/ (毎日のバックアップ)
    healthcheck:                     # Discord から切断・同期が止まっていると unhealthy になる (docker compose ps で見える)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 1m
      timeout: 10s
      start_period: 2m
      retries: 3
    logging:                         # ログが SD カードを埋め尽くさないように上限を設ける
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
